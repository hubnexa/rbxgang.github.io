<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBXGang - 404 No Encontrado</title>
<meta name="title" content="RBXGang - ¡Gana robux!">
<meta name="description" content="La plataforma más segura y rápida para la comunidad de Roblox. Únete a la Gang, participa en eventos y obtén recompensas reales sin compartir tu contraseña.">

<meta property="og:title" content="RBXGang - Únete a la plataforma más confiable">
<meta property="og:description" content="Sistema de recompensas automatizado y seguro. Sin riesgo de ban y con soporte 24/7.">

<meta property="twitter:card" content="summary_large_image">

<meta property="twitter:description" content="Obtén 200 créditos gratis por el evento de lanzamiento. ¡Solo hoy en rbxgang.xyz!">

<link rel="icon" type="image/x-icon" href="https://rbxgang.xyz/assets/logo.png">
<meta name="theme-color" content="#8b5cf6">
    <style>
        :root {
            --bg-color: #09090f;
            --accent: #8b5cf6;
            --discord: #5865F2;
            --text-main: #ffffff;
            --text-dim: #71717a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Partículas de fondo */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
            z-index: 0;
        }

        .container {
            padding: 40px;
            z-index: 10;
            position: relative;
        }

        .error-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            margin: 0;
            line-height: 0.9;
            background: linear-gradient(180deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.3));
        }

        .glitch-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.4;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: var(--text-dim);
            max-width: 450px;
            margin: 0 auto 40px;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            background: #9d71fd;
            box-shadow: 0 20px 35px -10px rgba(139, 92, 246, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        /* Animación de flotación para el 404 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .error-wrapper {
            animation: float 6s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h1 { font-size: 1.4rem; }
            p { font-size: 0.95rem; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <div class="error-wrapper">
            <div class="error-code">404</div>
        </div>
        
        <h1>Ruta no encontrada</h1>
        <p>Has aterrizado en una zona fuera de la Gang. La página que buscas no existe o ha sido eliminada del servidor.</p>
        
        <div class="nav-actions">
            <a href="/" class="btn btn-primary" id="main-action">
                <span id="icon-home"></span>
                Volver al Inicio
            </a>
            <a href="/Social" class="btn btn-secondary">
                Obtener Ayuda
            </a>
        </div>
    </div>

    <script type="module">
        // Inyectar Icono de Casa por código
        document.getElementById('icon-home').innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`;

        // Personalización dinámica según sesión
        const user = localStorage.getItem('rbx_user');
        if (user) {
            const mainBtn = document.getElementById('main-action');
            mainBtn.innerHTML = mainBtn.innerHTML.replace('Volver al Inicio', 'Ir al Dashboard');
        }
    </script>
</body>
</html>
