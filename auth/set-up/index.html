<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RBXGang - Setup</title>
<meta name="title" content="RBXGang - ¡Gana robux!">
<meta name="description" content="La plataforma más segura y rápida para la comunidad de Roblox. Únete a la Gang, participa en eventos y obtén recompensas reales sin compartir tu contraseña.">
<meta name="keywords" content="rbx, rewards, roblox community, rbxgang, recompensas, robux safe">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:url" content="https://rbxgang.xyz/">
<meta property="og:title" content="RBXGang - Únete a la plataforma más confiable">
<meta property="og:description" content="Sistema de recompensas automatizado y seguro. Sin riesgo de ban y con soporte 24/7.">
<meta property="og:image" content="https://rbxgang.xyz/assets/banner-preview.png">

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://rbxgang.xyz/">
<meta property="twitter:title" content="RBXGang - La comunidad número 1">
<meta property="twitter:description" content="Obtén 200 créditos gratis por el evento de lanzamiento. ¡Solo hoy en rbxgang.xyz!">
<meta property="twitter:image" content="https://rbxgang.xyz/assets/banner-preview.png">

<link rel="icon" type="image/x-icon" href="https://rbxgang.xyz/assets/logo.png">
<meta name="theme-color" content="#8b5cf6">
    <style>
        :root {
            --bg: #0b0f1a;
            --card: rgba(22, 27, 44, 0.8);
            --accent: #a78bfa;
            --error: #f87171;
            --text-dim: #94a3b8;
            --border: rgba(167, 139, 250, 0.15);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at top right, rgba(167, 139, 250, 0.05), transparent);
        }

        /* --- LOGO RBXGANG POR CÓDIGO --- */
        .gang-logo-raw {
            width: 50px; height: 50px; background: var(--accent);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #000; margin: 0 auto 20px;
        }

        .setup-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            width: 90%;
            max-width: 440px;
            padding: 40px;
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }

        /* --- ESTADOS DE ERROR --- */
        .status-screen { display: none; text-align: center; }
        .status-screen.active { display: block; }
        .icon-error { border: 2px solid var(--error); color: var(--error); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-weight: 900; }

        /* --- SELECTORES DE FECHA --- */
        .date-selectors { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; }
        select, input[type="text"] {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; box-sizing: border-box;
        }

        /* --- BOTONES --- */
        .btn-main {
            width: 100%; padding: 18px; background: #fff; color: #000; border: none;
            border-radius: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 25px;
        }
        .btn-main:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-support { background: var(--accent); color: #000; text-decoration: none; display: block; padding: 15px; border-radius: 12px; font-weight: 800; margin-top: 20px; }

        .discord-profile { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 20px; margin-bottom: 25px; border: 1px solid var(--border); }
        .discord-profile img { width: 45px; height: 45px; border-radius: 10px; border: 2px solid var(--accent); }
        
        .toggle-btn {
            background: rgba(167, 139, 250, 0.1); border: 1px solid var(--border);
            color: var(--accent); padding: 10px; border-radius: 10px; font-size: 0.75rem;
            cursor: pointer; width: 100%; margin-bottom: 10px; text-align: left; font-weight: 700;
        }
        .toggle-btn.checked { background: var(--accent); color: #000; }
    </style>
</head>
<body>

<div class="setup-card">
    <div class="gang-logo-raw">G</div>

    <div id="screen-no-auth" class="status-screen">
        <div class="icon-error">!</div>
        <h3>Error de Acceso</h3>
        <p style="color: var(--text-dim)">No se encontraron credenciales válidas de Discord. Por favor, intenta iniciar sesión nuevamente.</p>
        <button class="btn-main" onclick="location.href='/'">Volver al Inicio</button>
    </div>

    <div id="screen-multi" class="status-screen">
        <div class="icon-error">BID</div>
        <h3>Conflicto de Dispositivo</h3>
        <p style="color: var(--text-dim)">Este navegador ya está vinculado a otra cuenta de RBXGang. Para evitar fraudes, contacta con soporte.</p>
        <a href="https://discord.gg/rbxgang" class="btn-support">Hablar con Soporte</a>
    </div>

    <div id="screen-register" class="status-screen">
        <div class="discord-profile">
            <img id="d-avatar" src="" alt="">
            <div style="text-align: left;">
                <div id="d-name" style="font-weight: 800;">-</div>
                <button onclick="location.href='/'" style="background:none; border:none; color:var(--error); padding:0; cursor:pointer; font-size: 0.7rem;">¿No eres tú? Salir</button>
            </div>
        </div>

        <div style="text-align: left; margin-bottom: 20px;">
            <label style="font-size: 0.7rem; color: var(--accent); font-weight: 800; text-transform: uppercase;">Usuario de Roblox</label>
            <input type="text" id="r-user" placeholder="Ej: RobloxPlayer123">
        </div>

        <div style="text-align: left; margin-bottom: 20px;">
            <label style="font-size: 0.7rem; color: var(--accent); font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 8px;">Fecha de Nacimiento</label>
            <div class="date-selectors">
                <select id="dob-day"></select>
                <select id="dob-month"></select>
                <select id="dob-year"></select>
            </div>
        </div>

        <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 20px; text-align: left;">
            IP: <span id="info-ip" style="color:#fff">...</span> | BID: <span id="info-bid" style="color:#fff">...</span>
        </div>

        <button class="toggle-btn" id="btn-tos" onclick="toggleCheck('tos')">ACEPTAR TÉRMINOS Y PRIVACIDAD</button>
        <button class="toggle-btn" id="btn-ip" onclick="toggleCheck('ip')">ACEPTAR REGISTRO DE IP (ANTI-MULTI)</button>

        <button id="btn-create" class="btn-main" disabled onclick="createProfile()">Crear Perfil</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, query, where, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAceW9Yh2jRfY3pCFawWCTzP4Hvngt1V8g",
        authDomain: "rbxgang-86d30.firebaseapp.com",
        projectId: "rbxgang-86d30",
        storageBucket: "rbxgang-86d30.firebasestorage.app",
        appId: "1:35329039357:web:2430fb26473ef1e9fd1794"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let userData = null;
    let checks = { tos: false, ip: false };
    const bid = navigator.userAgent.replace(/\D+/g, '').substring(0, 10);

    // Llenar selectores de fecha
    const fillDate = () => {
        const d = document.getElementById('dob-day'), m = document.getElementById('dob-month'), y = document.getElementById('dob-year');
        for(let i=1; i<=31; i++) d.innerHTML += `<option value="${i}">${i}</option>`;
        ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'].forEach((v,i) => m.innerHTML += `<option value="${i+1}">${v}</option>`);
        for(let i=2013; i>=1950; i--) y.innerHTML += `<option value="${i}">${i}</option>`;
    };

    window.toggleCheck = (type) => {
        checks[type] = !checks[type];
        document.getElementById(`btn-${type}`).classList.toggle('checked');
        validate();
    };

    const validate = () => {
        const user = document.getElementById('r-user').value.trim();
        document.getElementById('btn-create').disabled = !(checks.tos && checks.ip && user.length > 2);
    };
    document.getElementById('r-user').addEventListener('input', validate);

    async function init() {
        fillDate();
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        // 1. Verificar si hay código/credenciales
        if (!code) {
            document.getElementById('screen-no-auth').classList.add('active');
            return;
        }

        try {
            // Obtener IP
            const ipReq = await fetch('https://api.ipify.org?format=json');
            const { ip } = await ipReq.json();
            document.getElementById('info-ip').innerText = ip;
            document.getElementById('info-bid').innerText = bid;

            // 2. Verificar si este BID ya tiene otra cuenta vinculada
            const q = query(collection(db, "users"), where("browserId", "==", bid));
            const querySnap = await getDocs(q);
            
            // Llamada a tu API para procesar el código de Discord
            const res = await fetch('https://rbxgang.xyz/api/auth/discord', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            userData = await res.json();

            if (!userData.id) throw new Error();

            // Lógica de Bloqueo BID
            let alreadyOwned = false;
            querySnap.forEach(doc => { if(doc.id !== userData.id) alreadyOwned = true; });
            
            if (alreadyOwned) {
                document.getElementById('screen-multi').classList.add('active');
                return;
            }

            // 3. Verificar si el usuario ya existe
            const userDoc = await getDoc(doc(db, "users", userData.id));
            if (userDoc.exists()) {
                localStorage.setItem('rbx_user', JSON.stringify(userDoc.data()));
                window.location.href = '/profile/dashboard';
                return;
            }

            // 4. Mostrar pantalla de registro si es nuevo
            document.getElementById('screen-register').classList.add('active');
            document.getElementById('d-name').innerText = userData.username;
            document.getElementById('d-avatar').src = `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`;

        } catch (e) {
            document.getElementById('screen-no-auth').classList.add('active');
        }
    }

    window.createProfile = async () => {
        const btn = document.getElementById('btn-create');
        btn.innerText = "PROCESANDO...";
        btn.disabled = true;

        const finalData = {
            discordId: userData.id,
            discordName: userData.username,
            avatar: userData.avatar,
            robloxUser: document.getElementById('r-user').value.trim(),
            dob: `${document.getElementById('dob-day').value}/${document.getElementById('dob-month').value}/${document.getElementById('dob-year').value}`,
            browserId: bid,
            ip: document.getElementById('info-ip').innerText,
            createdAt: new Date(),
            verified: true
        };

        try {
            await setDoc(doc(db, "users", userData.id), finalData);
            localStorage.setItem('rbx_user', JSON.stringify(finalData));
            window.location.href = '/profile/dashboard';
        } catch (e) {
            alert("Error al guardar perfil.");
            btn.disabled = false;
        }
    };

    init();
</script>
</body>
</html>
