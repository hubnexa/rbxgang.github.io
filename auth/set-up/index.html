<meta name="theme-color" content="#8b5cf6">    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05060f;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --card: rgba(13, 15, 28, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --error: #ef4444;
            --text-dim: #64748b;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* FONDO ANIMADO DE PARTÍCULAS */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .bg-mesh::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
        }

        /* CONTENEDOR PRINCIPAL */
        .setup-card {
            background: var(--card);
            backdrop-filter: blur(25px);
            width: 90%;
            max-width: 440px;
            padding: 40px;
            border-radius: 35px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* LOGO CODIFICADO G */
        .gang-logo {
            width: 65px; height: 65px;
            background: var(--accent);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 800; color: #000;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 40px var(--accent-glow); }
        }

        .status-screen { display: none; }
        .status-screen.active { display: block; animation: contentSlide 0.5s ease; }

        @keyframes contentSlide {
            from { opacity: 0; transform: translateY(10px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* PERFIL ESTILO GLASS */
        .discord-profile {
            display: flex; align-items: center; gap: 15px;
            background: rgba(255,255,255,0.03);
            padding: 16px; border-radius: 22px; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: left;
        }
        .discord-profile img {
            width: 55px; height: 55px; border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 2px solid var(--accent);
        }

        /* INPUTS Y FORMULARIOS */
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label {
            font-size: 0.65rem; color: var(--accent); font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px;
            margin-left: 5px; margin-bottom: 8px; display: block;
        }

        input[type="text"], select {
            width: 100%; padding: 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 16px; color: #fff;
            font-size: 0.95rem; transition: 0.3s;
            box-sizing: border-box; outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.05);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
        }

        .date-selectors { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; }

        /* BOTONES */
        .btn-main {
            width: 100%; padding: 20px;
            background: #fff; color: #000;
            border: none; border-radius: 18px;
            font-weight: 800; font-size: 0.9rem;
            text-transform: uppercase; cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 20px;
        }

        .btn-main:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.15);
        }

        .btn-main:disabled { opacity: 0.15; filter: grayscale(1); cursor: not-allowed; }

        .toggle-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text-dim); padding: 14px;
            border-radius: 15px; font-size: 0.75rem;
            cursor: pointer; width: 100%; margin-bottom: 10px;
            text-align: left; font-weight: 600; transition: 0.3s;
        }

        .toggle-btn.checked {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--accent); color: #fff;
        }

        /* CONSOLA DE DATOS */
        .data-console {
            font-family: 'Fira Code', monospace;
            background: #000;
            padding: 12px; border-radius: 14px;
            font-size: 0.65rem; color: var(--accent);
            border: 1px solid rgba(139, 92, 246, 0.2);
            margin: 20px 0; text-align: left;
        }

        /* LOADER ANIMADO */
        .custom-loader {
            width: 40px; height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .timer-bar { 
            width: 100%; height: 5px; background: rgba(255,255,255,0.05); 
            border-radius: 10px; margin-top: 25px; overflow: hidden;
        }
        .timer-progress { 
            width: 100%; height: 100%; background: var(--success); 
            transition: width 5s linear; 
        }

    </style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="setup-card">
    <div class="gang-logo">G</div>

    <div id="screen-loading" class="status-screen active">
        <div class="custom-loader"></div>
        <p style="color: var(--text-dim); letter-spacing: 1px; font-size: 0.8rem;">AUTENTICANDO PROTOCOLO...</p>
    </div>

    <div id="screen-found" class="status-screen">
        <h3 style="color: var(--success); margin: 0 0 10px 0; font-size: 1.4rem;">IDENTIDAD CONFIRMADA</h3>
        <p style="color: var(--text-dim); font-size: 0.85rem; margin-bottom: 25px;">Sincronizando con el servidor central...</p>
        
        <div class="discord-profile">
            <img class="d-avatar-img" src="" alt="Avatar">
            <div>
                <div class="d-username-txt" style="font-weight: 800; font-size: 1.1rem;">-</div>
                <div style="font-size: 0.65rem; color: var(--success); text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">✓ Acceso Permitido</div>
            </div>
        </div>

        <div class="data-console">
            > NODE_IP: <span class="info-ip-txt">...</span><br>
            > DEVICE_ID: <span class="info-bid-txt">...</span>
        </div>

        <div class="timer-bar"><div id="p-bar" class="timer-progress"></div></div>
        <p style="font-size: 0.75rem; margin-top: 15px; color: var(--text-dim);">Redirigiendo en <span id="cd" style="color:#fff">5</span>s</p>
    </div>

    <div id="screen-register" class="status-screen">
        <div class="discord-profile">
            <img class="d-avatar-img" src="" alt="Avatar">
            <div style="text-align: left;">
                <div class="d-username-txt" style="font-weight: 800;">-</div>
                <button onclick="location.href='/'" style="background:none; border:none; color:var(--error); padding:0; cursor:pointer; font-size: 0.65rem; font-weight: 700;">CANCELAR ENLACE</button>
            </div>
        </div>

        <div class="input-group">
            <label>Username Roblox</label>
            <input type="text" id="r-user" placeholder="Ej: Player123" oninput="validateForm()">
        </div>

        <div class="input-group">
            <label>Fecha de Nacimiento</label>
            <div class="date-selectors">
                <select id="dob-day"></select>
                <select id="dob-month"></select>
                <select id="dob-year"></select>
            </div>
        </div>

        <div class="data-console" style="margin: 10px 0 20px 0;">
            > IP: <span class="info-ip-txt">...</span><br>
            > BID: <span class="info-bid-txt">...</span>
        </div>

        <button class="toggle-btn" id="btn-tos" onclick="toggleCheck('tos')">ACEPTAR TÉRMINOS Y SERVICIO</button>
        <button class="toggle-btn" id="btn-ip" onclick="toggleCheck('ip')">AUTORIZAR REGISTRO DE IP</button>

        <button id="btn-create" class="btn-main" disabled onclick="createProfile()">Finalizar Registro</button>
    </div>

    <div id="screen-error" class="status-screen">
        <div style="font-size: 3rem; margin-bottom: 15px;">⚠️</div>
        <h3 id="err-title" style="color: var(--error); margin: 0; text-transform: uppercase; letter-spacing: 1px;"></h3>
        <p id="err-desc" style="color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; margin: 15px 0 25px 0;"></p>
        <button class="btn-main" style="background: var(--error); color: #fff;" onclick="location.href='/'">CERRAR PROTOCOLO</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, query, where, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAceW9Yh2jRfY3pCFawWCTzP4Hvngt1V8g",
        authDomain: "rbxgang-86d30.firebaseapp.com",
        projectId: "rbxgang-86d30",
        storageBucket: "rbxgang-86d30.firebasestorage.app",
        appId: "1:35329039357:web:2430fb26473ef1e9fd1794"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let userData = null;
    let checks = { tos: false, ip: false };
    const bid = navigator.userAgent.replace(/\D+/g, '').substring(0, 12);

    const show = (id) => {
        document.querySelectorAll('.status-screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    const fillDates = () => {
        const d = document.getElementById('dob-day'), m = document.getElementById('dob-month'), y = document.getElementById('dob-year');
        d.innerHTML = m.innerHTML = y.innerHTML = "";
        for(let i=1; i<=31; i++) d.innerHTML += `<option value="${i}">${i}</option>`;
        ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'].forEach((v,i) => m.innerHTML += `<option value="${i+1}">${v}</option>`);
        for(let i=2014; i>=1950; i--) y.innerHTML += `<option value="${i}">${i}</option>`;
    };

    window.validateForm = () => {
        const user = document.getElementById('r-user').value.trim();
        document.getElementById('btn-create').disabled = !(checks.tos && checks.ip && user.length > 2);
    };

    window.toggleCheck = (t) => {
        checks[t] = !checks[t];
        document.getElementById(`btn-${t}`).classList.toggle('checked');
        validateForm();
    };

    async function start() {
        const code = new URLSearchParams(window.location.search).get('code');
        
        try {
            // Captura de IP vía Cloudflare (Resistente)
            const trace = await fetch('https://1.1.1.1/cdn-cgi/trace').then(r => r.text());
            const userIp = trace.match(/ip=([0-9.]+)/)[1];

            document.querySelectorAll('.info-ip-txt').forEach(el => el.innerText = userIp);
            document.querySelectorAll('.info-bid-txt').forEach(el => el.innerText = bid);

            if (!code) throw new Error("NO_CODE");

            // Simulación de Auth API (Reemplazar por tu endpoint real)
            const res = await fetch('/api/auth/discord', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            if(!res.ok) throw new Error("AUTH_FAILED");
            userData = await res.json();

            // LÓGICA DE SEGURIDAD: DOBLE IP / MULTIACCIÓN
            const q = query(collection(db, "users"), where("ip", "==", userIp));
            const snap = await getDocs(q);
            let isMulti = false;
            snap.forEach(d => { if(d.id !== userData.id) isMulti = true; });

            if(isMulti) {
                document.getElementById('err-title').innerText = "Vínculo Duplicado";
                document.getElementById('err-desc').innerText = "Tu dirección IP ya está asociada a otra cuenta. Solo se permite una cuenta por usuario real.";
                show('screen-error');
                return;
            }

            const userDoc = await getDoc(doc(db, "users", userData.id));

            if (userDoc.exists()) {
                show('screen-found');
                document.querySelectorAll('.d-username-txt').forEach(el => el.innerText = userData.username);
                document.querySelectorAll('.d-avatar-img').forEach(el => el.src = `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`);
                
                // Animación barra y redirección
                setTimeout(() => document.getElementById('p-bar').style.width = '0%', 100);
                let timer = 5;
                const intv = setInterval(() => {
                    timer--;
                    document.getElementById('cd').innerText = timer;
                    if(timer <= 0) {
                        clearInterval(intv);
                        localStorage.setItem('rbx_user', JSON.stringify(userDoc.data()));
                        window.location.href = '/profile/dashboard';
                    }
                }, 1000);
            } else {
                fillDates();
                document.querySelectorAll('.d-username-txt').forEach(el => el.innerText = userData.username);
                document.querySelectorAll('.d-avatar-img').forEach(el => el.src = `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`);
                show('screen-register');
            }

        } catch (e) {
            document.getElementById('err-title').innerText = "Acceso Denegado";
            document.getElementById('err-desc').innerText = "No se ha podido validar tu sesión o los escudos de red han bloqueado la conexión.";
            show('screen-error');
        }
    }

    window.createProfile = async () => {
        const b = document.getElementById('btn-create');
        b.innerText = "REGISTRANDO...";
        b.disabled = true;

        const data = {
            discordId: userData.id,
            discordName: userData.username,
            avatar: userData.avatar,
            robloxUser: document.getElementById('r-user').value.trim(),
            dob: `${document.getElementById('dob-day').value}/${document.getElementById('dob-month').value}/${document.getElementById('dob-year').value}`,
            browserId: bid,
            ip: document.querySelector('.info-ip-txt').innerText,
            createdAt: new Date().toISOString(),
            balance: 0
        };

        try {
            await setDoc(doc(db, "users", userData.id), data);
            localStorage.setItem('rbx_user', JSON.stringify(data));
            window.location.href = '/profile/dashboard';
        } catch (e) {
            alert("Error al guardar.");
            b.disabled = false;
        }
    };

    start();
</script>
</body>
</html>
