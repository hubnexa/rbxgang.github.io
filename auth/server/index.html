    <style>
        :root {
            --bg-color: #030305;
            --card-bg: rgba(15, 15, 20, 0.95);
            --primary-violet: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.3);
            --text-white: #f8fafc;
            --text-gray: #64748b;
            --success: #10b981;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #110c1d 0%, var(--bg-color) 100%);
            font-family: 'Inter', sans-serif;
            color: var(--text-white);
        }

        .verify-card {
            background: var(--card-bg);
            width: 90%;
            max-width: 480px;
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        /* Barra de escaneo animada */
        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary-violet);
            box-shadow: 0 0 15px var(--primary-violet);
            animation: scan 3s linear infinite;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .loader {
            width: 70px; height: 70px;
            border: 3px solid rgba(139, 92, 246, 0.1);
            border-top: 3px solid var(--primary-violet);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.76, 0, 0.24, 1) infinite;
            margin: 0 auto 30px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        h1 {
            font-size: 28px; font-weight: 900; margin-bottom: 15px;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, var(--primary-violet));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        p { color: var(--text-gray); line-height: 1.7; font-size: 15px; margin-bottom: 0; }

        .console {
            background: rgba(0,0,0,0.4);
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--primary-violet);
            padding: 15px;
            border-radius: 12px;
            margin-top: 25px;
            text-align: left;
            border: 1px solid rgba(139, 92, 246, 0.1);
        }

        .status-success { color: var(--success); }
        
        .icon-success {

            display: none; margin-bottom: 20px;

<body>

    <div class="verify-card">
        <div class="scan-line" id="scanner"></div>
        <div id="loader" class="loader"></div>
        <div id="success-icon" class="icon-success">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        
        <h1 id="title">Integrity Check</h1>
        <p id="desc">Sincronizando con los nodos de seguridad de RBXGang. Por favor, mantén esta ventana activa.</p>

        <div class="console" id="console-logs">
            > Initializing security handshake...<br>
            > Analysing network headers...
        </div>
    </div>

<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAceW9Yh2jRfY3pCFawWCTzP4Hvngt1V8g",
        authDomain: "rbxgang-86d30.firebaseapp.com",
        projectId: "rbxgang-86d30",
        storageBucket: "rbxgang-86d30.firebasestorage.app",
        messagingSenderId: "35329039357",
        appId: "1:35329039357:web:2430fb26473ef1e9fd1794"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const db = getFirestore(app);

    const addLog = (text, color = "") => {
        const logs = document.getElementById('console-logs');
        if (logs) {
            logs.innerHTML += `<br>> <span style="color:${color}">${text}</span>`;
            logs.scrollTop = logs.scrollHeight;
        }
    };

    async function verify() {
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const clientId = urlParams.get('client_id');

        if (!userId) {
            addLog("ERROR: UID_NOT_FOUND", "#ef4444");
            return;
        }

        try {
            addLog("Iniciando secuencia de enlace...");

            // 1. Obtener IP actual vía Cloudflare (Resistente a bloqueos)
            let userIp = null;
            try {
                const response = await fetch('https://1.1.1.1/cdn-cgi/trace');
                const text = await response.text();
                userIp = text.match(/ip=([0-9.]+)/)[1];
            } catch (e) {
                addLog("Error de red al capturar IP", "#ef4444");
                return;
            }

            addLog(`IP Detectada: ${userIp}`);

            // 2. BUSCAR DOBLE IP en ServerUsers > {ids} > ip
            addLog("Escaneando registros globales...");
            const usersRef = collection(db, "ServerUsers");
            const q = query(usersRef, where("ip", "==", userIp));
            const querySnapshot = await getDocs(q);

            let isDuplicate = false;
            querySnapshot.forEach(docSnap => {
                // Si encontramos la IP en un ID que NO es el actual
                if (docSnap.id !== userId) {
                    isDuplicate = true;
                }
            });

            if (isDuplicate) {
                addLog("ALERTA: IP ya vinculada a otra cuenta", "#ef4444");
                setTimeout(() => {
                    window.location.href = "/auth/denied/?type=double_ip";
                }, 1500);
                return;
            }

            // 3. REGISTRAR si todo está bien
            addLog("Autorizando acceso...");
            await setDoc(doc(db, "ServerUsers", userId), {
                ip: userIp,
                client: clientId || "web_auth",
                verifiedAt: new Date().toISOString()
            }, { merge: true });

            addLog("VINCULACIÓN EXITOSA", "#10b981");
            finishUI();

        } catch (err) {
            console.error(err);
            addLog("FALLO CRÍTICO DE KERNEL", "#ef4444");
        }
    }

    function finishUI() {
        if(document.getElementById('loader')) document.getElementById('loader').style.display = "none";
        if(document.getElementById('success-icon')) document.getElementById('success-icon').style.display = "block";
        document.getElementById('title').innerText = "VINCULADO";
        document.getElementById('desc').innerHTML = "Tu IP ha sido registrada. Ya puedes volver a Discord.";
    }

    window.onload = () => setTimeout(verify, 1000);
</script>
