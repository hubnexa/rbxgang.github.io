    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050507;
            --danger: #ff4757;
            --accent: #8b5cf6;
            --text: #ffffff;
            --panel: rgba(20, 20, 25, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Fondo de malla animado */
        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: move 10s linear infinite;
            z-index: -1;
            top: -50%;
        }

        @keyframes move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        .container {
            text-align: center;
            padding: 40px;
            background: var(--panel);
            border: 2px solid var(--danger);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(255, 71, 87, 0.2);
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        .glitch-icon {
            font-size: 80px;
            color: var(--danger);
            margin-bottom: 20px;
            animation: glitch 0.3s infinite;
        }

        h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 10px 0;
            color: var(--danger);
        }

        .error-code {
            font-family: 'Fira Code', monospace;
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger);
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 20px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            font-size: 15px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #475569;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }

        .btn-retry {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-retry:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="container">
        <div class="glitch-icon">⚠</div>
        <div class="error-code" id="err-slug">ERR_AUTH_FAILURE</div>
        <h1 id="err-title">Acceso Denegado</h1>
        <p id="err-desc">El sistema de seguridad ha interrumpido tu sesión debido a una inconsistencia en los datos.</p>
        
        <a href="javascript:location.reload()" class="btn-retry">REINTENTAR SINCRONIZACIÓN</a>

        <div class="footer-note">
            RBXG Kernel v4.2 // Automated Security Response
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        
        const title = document.getElementById('err-title');
        const desc = document.getElementById('err-desc');
        const slug = document.getElementById('err-slug');

        // Manejo de casos según el tipo de error
        switch(type) {
            case 'double_ip':
                slug.innerText = "CONFLICT: DOUBLE_IP_DETECTED";
                title.innerText = "MULTICUENTA DETECTADA";
                desc.innerHTML = "Esta dirección IP ya se encuentra vinculada a otra identidad en nuestra base de datos. <br><br><strong>Política: 1 Cuenta por IP.</strong>";
                break;
            
            case 'vpn':
                slug.innerText = "SECURITY: PROXY_REJECTED";
                title.innerText = "VPN NO PERMITIDA";
                desc.innerHTML = "Se ha detectado el uso de un túnel cifrado o proxy. Por seguridad, debes usar tu conexión real para verificar tu identidad.";
                break;

            case 'credentials':
                slug.innerText = "AUTH: NULL_PARAMETERS";
                title.innerText = "SESIÓN INVÁLIDA";
                desc.innerHTML = "No se han detectado credenciales de Discord en la URL. Por favor, vuelve a generar el enlace desde el servidor.";
                break;

            case 'access_denied':
                slug.innerText = "CORE: KERNEL_REJECTION";
                title.innerText = "FALLO DE ENLACE";
                desc.innerHTML = "El servidor ha rechazado la solicitud de escritura. Esto puede deberse a un tiempo de espera agotado o bloqueo de firewall.";
                break;

            default:
                slug.innerText = "UNKNOWN_ERROR";
                title.innerText = "ERROR DE SISTEMA";
                desc.innerHTML = "Ha ocurrido un error inesperado durante el proceso de verificación.";
        }
    </script>
</body>
